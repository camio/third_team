name: Build Typst PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: "0.14.2"

      - name: Install document fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-texgyre

      - name: Compile Typst to PDF
        run: typst compile paper.typ paper.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
          if-no-files-found: error
